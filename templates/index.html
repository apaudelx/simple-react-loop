<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Agent</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.5 system-ui, sans-serif; background: #f6f6f7; color: #1a1a1a;
  }
  header {
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd;
    display: flex; justify-content: space-between; align-items: center;
  }
  header b { font-weight: 600; }
  header span { color: #888; font-size: 13px; }
  #clear { border: 1px solid #ccc; background: #fff; border-radius: 6px;
           padding: 4px 10px; font-size: 13px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 640px; margin: 0 auto 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; }
  .user .bubble { background: #2563eb; color: #fff; }
  .bot .bubble { background: #fff; border: 1px solid #e0e0e0; }
  .tools { max-width: 640px; margin: 0 auto 8px; font-family: ui-monospace, monospace;
           font-size: 12px; color: #999; }
  .err .bubble { background: #fee; border: 1px solid #fcc; color: #900; }
  footer { padding: 12px 16px; background: #fff; border-top: 1px solid #ddd; }
  form { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; }
  input {
    flex: 1; padding: 10px 13px; font-size: 15px; font-family: inherit;
    border: 1px solid #ccc; border-radius: 8px;
  }
  input:focus { outline: 2px solid #2563eb; outline-offset: -1px; }
  button[type=submit] { padding: 10px 18px; font-size: 15px; border: 0; border-radius: 8px;
                        background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <b>Time Agent</b>
    <span>{{ model }}</span>
    <button id="clear">Clear</button>
  </header>

  <div id="log">
    <div class="msg bot"><div class="bubble">Ask me the time anywhere. Try "what time is it in Tokyo?"</div></div>
  </div>

  <footer>
    <form id="form">
      <input id="input" autocomplete="off" placeholder="Ask about the time somewhere..." autofocus>
      <button type="submit" id="send">Send</button>
    </form>
  </footer>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

function addMessage(text, kind) {
  const row = document.createElement('div');
  row.className = 'msg ' + kind;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

function addTools(calls) {
  const div = document.createElement('div');
  div.className = 'tools';
  div.textContent = calls.map(c => '-> ' + c).join('\n');
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  input.value = '';
  send.disabled = true;
  const pending = addMessage('thinking...', 'bot');

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    const data = await res.json();
    pending.remove();
    if (data.tools && data.tools.length) addTools(data.tools);
    if (data.error) addMessage(data.error, 'bot err');
    else addMessage(data.reply, 'bot');
  } catch (err) {
    pending.remove();
    addMessage('Could not reach the server: ' + err.message, 'bot err');
  } finally {
    send.disabled = false;
    input.focus();
  }
};

document.getElementById('clear').onclick = async () => {
  await fetch('/reset', {method: 'POST'});
  log.innerHTML = '';
  addMessage('History cleared.', 'bot');
  input.focus();
};
</script>
</body>
</html>
